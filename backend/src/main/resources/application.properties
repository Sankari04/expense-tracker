# ===================================================
# Spring Boot Configuration - Expense Tracker
# ===================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=expense-tracker-backend

# ===================================================
# MySQL Database Configuration
# ===================================================
# Update the username and password below if your MySQL setup uses different credentials.
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================
# JPA / Hibernate Configuration
# ===================================================
# 'update' automatically updates table schema without deleting existing data
spring.jpa.hibernate.ddl-auto=update

# Show executed SQL queries in terminal console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
